spring.application.name=SmakRoom

# Database (PostgreSQL) — change credentials as needed
spring.datasource.url=jdbc:postgresql://localhost:5432/smakroom
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Multipart (file upload for product images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
app.upload.dir=uploads

# Session
server.servlet.session.timeout=30m

# Logging
logging.level.com.smakroom=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CBR API (exchange rates)
app.cbr.api.url=https://www.cbr-xml-daily.ru/daily_json.js

# Server
server.port=8080
server.error.whitelabel.enabled=false
