<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Админ-панель — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-shield-lock text-pink"></i> Админ-панель</h2>
    </div>

    <!-- Stats cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <i class="bi bi-box-seam text-pink fs-2"></i>
                <h3 class="fw-bold mt-2 mb-0" th:text="${totalProducts}">0</h3>
                <small class="text-muted">Продуктов</small>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <i class="bi bi-bag-check text-success fs-2"></i>
                <h3 class="fw-bold mt-2 mb-0" th:text="${totalOrders}">0</h3>
                <small class="text-muted">Заказов</small>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <i class="bi bi-tags text-info fs-2"></i>
                <h3 class="fw-bold mt-2 mb-0" th:text="${#lists.size(categories)}">0</h3>
                <small class="text-muted">Категорий</small>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
                <i class="bi bi-fire text-warning fs-2"></i>
                <h3 class="fw-bold mt-2 mb-0" th:text="${#lists.size(popularProducts)}">0</h3>
                <small class="text-muted">Популярных</small>
            </div>
        </div>
    </div>

    <!-- Quick actions -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <a th:href="@{/admin/products/new}" class="card border-0 shadow-sm text-decoration-none text-dark p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-plus-circle-fill text-pink fs-2"></i>
                <div>
                    <p class="fw-bold mb-0">Добавить продукт</p>
                    <small class="text-muted">Новая позиция в каталог</small>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/admin/orders}" class="card border-0 shadow-sm text-decoration-none text-dark p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-list-check text-success fs-2"></i>
                <div>
                    <p class="fw-bold mb-0">Управление заказами</p>
                    <small class="text-muted">Просмотр и обновление статусов</small>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/admin/users}" class="card border-0 shadow-sm text-decoration-none text-dark p-3 d-flex flex-row align-items-center gap-3">
                <i class="bi bi-people-fill text-info fs-2"></i>
                <div>
                    <p class="fw-bold mb-0">Пользователи</p>
                    <small class="text-muted">Список всех пользователей</small>
                </div>
            </a>
        </div>
    </div>

    <!-- Categories management -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-transparent fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-tags"></i> Категории</span>
            <button class="btn btn-sm btn-pink" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                <i class="bi bi-plus"></i> Добавить
            </button>
        </div>
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2">
                <span th:each="cat : ${categories}"
                      class="badge bg-light text-dark border fs-6 px-3 py-2"
                      th:text="${cat.name}"></span>
            </div>
        </div>
    </div>

    <!-- Popular products -->
    <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(popularProducts)}">
        <div class="card-header bg-transparent fw-bold"><i class="bi bi-fire text-warning"></i> Популярные товары</div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Название</th><th>Категория</th><th>Цена</th><th></th></tr></thead>
                <tbody>
                    <tr th:each="p : ${popularProducts}">
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.category != null ? p.category.name : '—'}"></td>
                        <td class="text-pink fw-semibold" th:text="${p.price} + ' ₽'"></td>
                        <td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новая категория</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Название *</label>
                    <input type="text" id="catName" class="form-control" placeholder="Например: Зефир">
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea id="catDesc" class="form-control" rows="2"></textarea>
                </div>
                <div id="catFeedback" class="d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-pink" id="saveCategoryBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>
</main>
<th:block th:fragment="scripts">
<script>
$(function(){
    var csrf = $('meta[name="_csrf"]').attr('content');
    var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

    $('#saveCategoryBtn').on('click', function(){
        var name = $('#catName').val().trim();
        if(!name){ alert('Введите название'); return; }
        $.ajax({
            url: '/admin/categories', method: 'POST',
            data: { name: name, description: $('#catDesc').val() },
            beforeSend: function(xhr){ xhr.setRequestHeader(csrfHeader, csrf); },
            success: function(resp){
                $('#catFeedback').removeClass('d-none alert-danger')
                    .addClass('alert alert-success').text('Категория «' + resp.name + '» добавлена');
                setTimeout(function(){ location.reload(); }, 1000);
            },
            error: function(){ $('#catFeedback').removeClass('d-none').addClass('alert alert-danger').text('Ошибка'); }
        });
    });
});
</script>
</th:block>
</body>
</html>
