<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Заказы — Админ — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-list-check text-pink"></i> Заказы</h2>
        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">← Дашборд</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>№</th>
                        <th>Покупатель</th>
                        <th>Дата</th>
                        <th>Позиций</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th style="width:100px">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${orders.empty}">
                        <td colspan="7" class="text-center text-muted py-4">Заказов нет</td>
                    </tr>
                    <tr th:each="order : ${orders.content}">
                        <td><strong th:text="'#' + ${order.id}"></strong></td>
                        <td th:text="${order.user.username}"></td>
                        <td th:text="${#temporals.format(order.createdAt,'dd.MM.yyyy HH:mm')}"></td>
                        <td th:text="${#lists.size(order.items)}"></td>
                        <td class="fw-semibold text-pink" th:text="${order.totalPrice} + ' ₽'"></td>
                        <td>
                            <select class="form-select form-select-sm status-select"
                                    th:data-order-id="${order.id}"
                                    style="min-width:160px">
                                <option th:each="s : ${statuses}"
                                        th:value="${s.name()}"
                                        th:text="${s.displayName}"
                                        th:selected="${s == order.status}"></option>
                            </select>
                        </td>
                        <td>
                            <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${orders.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1})}"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                th:classappend="${i == orders.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/orders(page=${i})}" th:text="${i+1}">1</a>
            </li>
            <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1})}"><i class="bi bi-chevron-right"></i></a>
            </li>
        </ul>
    </nav>

    <div id="statusToast" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Статус обновлён</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</div>
</main>
<th:block th:fragment="scripts">
<script>
$(function(){
    var csrf = $('meta[name="_csrf"]').attr('content');
    var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

    $('.status-select').on('change', function(){
        var orderId = $(this).data('order-id');
        var status = $(this).val();
        $.ajax({
            url: '/admin/orders/' + orderId + '/status',
            method: 'POST',
            data: { status: status },
            beforeSend: function(xhr){ xhr.setRequestHeader(csrfHeader, csrf); },
            success: function(resp){
                var toast = new bootstrap.Toast($('#statusToast .toast')[0]);
                $('#toastMsg').text('Заказ #' + orderId + ': ' + resp.statusDisplay);
                toast.show();
            },
            error: function(xhr){
                alert(xhr.responseJSON ? xhr.responseJSON.error : 'Ошибка обновления');
            }
        });
    });
});
</script>
</th:block>
</body>
</html>
