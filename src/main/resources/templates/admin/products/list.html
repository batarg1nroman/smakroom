<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Продукты — Админ — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-box-seam text-pink"></i> Продукты</h2>
        <a th:href="@{/admin/products/new}" class="btn btn-pink fw-semibold">
            <i class="bi bi-plus-lg"></i> Добавить продукт
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width:60px">Фото</th>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Цена</th>
                        <th>Остаток</th>
                        <th>Статус</th>
                        <th style="width:120px">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${products.empty}">
                        <td colspan="7" class="text-center text-muted py-4">Продукты не найдены</td>
                    </tr>
                    <tr th:each="p : ${products.content}">
                        <td>
                            <img th:src="${p.imageUrl != null ? p.imageUrl : '/img/placeholder.svg'}"
                                 class="rounded" style="width:50px;height:50px;object-fit:cover" th:alt="${p.name}">
                        </td>
                        <td>
                            <p class="fw-semibold mb-0" th:text="${p.name}"></p>
                            <small class="text-muted" th:text="${#strings.abbreviate(p.description, 50)}"></small>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border"
                                  th:text="${p.category != null ? p.category.name : '—'}"></span>
                        </td>
                        <td class="fw-semibold text-pink" th:text="${p.price} + ' ₽'"></td>
                        <td th:text="${p.stock}"></td>
                        <td>
                            <span th:if="${p.available}" class="badge bg-success">В наличии</span>
                            <span th:unless="${p.available}" class="badge bg-secondary">Недоступен</span>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/admin/products/{id}/edit(id=${p.id})}"
                                   class="btn btn-sm btn-outline-secondary" title="Редактировать">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                                      onsubmit="return confirm('Удалить продукт?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Удалить">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${products.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/products(page=${products.number - 1})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/products(page=${i})}" th:text="${i+1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/products(page=${products.number + 1})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
