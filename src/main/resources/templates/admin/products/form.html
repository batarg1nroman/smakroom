<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title th:text="${product != null ? 'Редактировать продукт' : 'Новый продукт'} + ' — SmakRoom'">Продукт — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/products}">Продукты</a></li>
            <li class="breadcrumb-item active"
                th:text="${product != null ? 'Редактировать' : 'Новый продукт'}"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent">
                    <h4 class="fw-bold mb-0"
                        th:text="${product != null ? 'Редактировать: ' + product.name : 'Новый продукт'}">
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${product != null ? '/admin/products/' + product.id + '/edit' : '/admin/products/new'}"
                          method="post" th:object="${productDto}"
                          enctype="multipart/form-data" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Название *</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Например: Торт «Медовик»">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Описание *</label>
                            <textarea th:field="*{description}" class="form-control" rows="4"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      placeholder="Подробное описание продукта..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Цена (₽) *</label>
                                <input type="number" th:field="*{price}" class="form-control"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                       step="0.01" min="0.01" placeholder="0.00">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Остаток</label>
                                <input type="number" th:field="*{stock}" class="form-control"
                                       th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"
                                       min="0" placeholder="0">
                                <div class="invalid-feedback" th:errors="*{stock}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Категория *</label>
                                <select th:field="*{categoryId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                    <option value="">— выберите —</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">URL изображения</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control"
                                   placeholder="https://... или оставьте пустым">
                            <small class="text-muted">Или загрузите файл ниже</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Загрузить изображение</label>
                            <input type="file" name="image" class="form-control" accept="image/*"
                                   id="imageInput">
                            <div id="imagePreviewWrap" class="mt-2 d-none">
                                <img id="imagePreview" class="rounded" style="max-height:150px">
                            </div>
                            <div th:if="${product != null and product.imageUrl != null}" class="mt-2">
                                <small class="text-muted">Текущее фото:</small><br>
                                <img th:src="${product.imageUrl}" class="rounded mt-1" style="max-height:100px">
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{available}" id="availableCheck">
                                <label class="form-check-label fw-semibold" for="availableCheck">В наличии (доступен для заказа)</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-pink fw-semibold px-4">
                                <i class="bi bi-check-lg"></i>
                                <span th:text="${product != null ? 'Сохранить изменения' : 'Добавить продукт'}"></span>
                            </button>
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
<th:block th:fragment="scripts">
<script>
$(function(){
    $('#imageInput').on('change', function(){
        var file = this.files[0];
        if(file){
            var reader = new FileReader();
            reader.onload = function(e){
                $('#imagePreview').attr('src', e.target.result);
                $('#imagePreviewWrap').removeClass('d-none');
            };
            reader.readAsDataURL(file);
        }
    });
});
</script>
</th:block>
</body>
</html>
