<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, main, headExtra, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:replace="${title}">SmakRoom</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <th:block th:replace="${headExtra}"></th:block>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-cake2-fill text-pink"></i> SmakRoom
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalog}"><i class="bi bi-grid"></i> Каталог</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i> Главная</a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-center gap-2">
                <!-- Cart icon -->
                <li class="nav-item">
                    <a class="nav-link position-relative" th:href="@{/cart}" id="cartNavLink">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill"
                              id="cartBadge" style="display:none">0</span>
                    </a>
                </li>

                <!-- Authenticated user -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person"></i> Профиль</a></li>
                        <li><a class="dropdown-item" th:href="@{/orders/history}"><i class="bi bi-bag"></i> Мои заказы</a></li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-danger" th:href="@{/admin}"><i class="bi bi-shield-lock"></i> Админ-панель</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right"></i> Выйти
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>

                <!-- Guest -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/auth/login}"><i class="bi bi-box-arrow-in-right"></i> Войти</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/auth/register}">Регистрация</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- FLASH MESSAGES -->
<div class="container mt-3" th:if="${successMsg != null or errorMsg != null}">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- MAIN CONTENT -->
<main th:replace="${main}">
</main>

<!-- FOOTER -->
<footer class="footer bg-dark text-white mt-5 py-4">
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <h5 class="fw-bold"><i class="bi bi-cake2-fill"></i> SmakRoom</h5>
                <p class="text-muted small">Домашняя кондитерская с душой</p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold">Самовывоз</h6>
                <p class="text-muted small mb-1"><i class="bi bi-geo-alt-fill"></i> г. Казань, Проезд Яраткан 3А, подъезд 3</p>
                <p class="text-muted small"><i class="bi bi-clock"></i> Пн–Вс: 10:00–20:00</p>
            </div>
            <div class="col-md-4 text-md-end">
                <p class="text-muted small">&copy; 2025 SmakRoom. Все права защищены.</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
