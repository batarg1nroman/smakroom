<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Ошибка — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-circle-fill text-pink" style="font-size:5rem"></i>
        <h2 class="fw-semibold mt-3 mb-3">Не удалось выполнить операцию</h2>
        <p class="text-muted fs-5 mb-4" th:text="${message} ?: 'Произошла ошибка.'"></p>
        <div class="d-flex gap-3 justify-content-center">
            <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">← Назад</button>
            <a th:href="@{/}" class="btn btn-pink btn-lg">На главную</a>
        </div>
    </div>
</div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
