<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Ошибка сервера — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:5rem"></i>
        <h1 class="display-1 fw-bold text-warning">500</h1>
        <h3 class="fw-semibold mb-3">Ошибка сервера</h3>
        <p class="text-muted mb-4" th:text="${message} ?: 'Что-то пошло не так. Мы уже разбираемся.'"></p>
        <a th:href="@{/}" class="btn btn-pink btn-lg px-5">На главную</a>
    </div>
</div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
