<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Каталог — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="page-header mb-0">
    <div class="container">
        <h2 class="mb-0">Каталог</h2>
    </div>
</div>

<div class="container py-4">

    <!-- Filters row -->
    <form th:action="@{/catalog}" method="get" class="row g-2 mb-4 align-items-end" id="filterForm">
        <div class="col-12 col-md-4">
            <input type="text" name="query" class="form-control" placeholder="Поиск по названию..."
                   th:value="${query}">
        </div>
        <div class="col-6 col-md-3">
            <select name="categoryId" class="form-select">
                <option value="">Все категории</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${cat.id == selectedCategoryId}">
                </option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <select name="sort" class="form-select">
                <option value="" th:selected="${sort == null}">Новинки</option>
                <option value="price_asc" th:selected="${sort == 'price_asc'}">Цена ↑</option>
                <option value="price_desc" th:selected="${sort == 'price_desc'}">Цена ↓</option>
                <option value="name" th:selected="${sort == 'name'}">По названию</option>
            </select>
        </div>
        <div class="col-12 col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-pink flex-grow-1">
                <i class="bi bi-search"></i> Найти
            </button>
            <a th:href="@{/catalog}" class="btn btn-outline-secondary">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </form>

    <!-- Currency switcher -->
    <div class="d-flex align-items-center gap-2 mb-3" th:if="${rates != null}">
        <small class="text-muted">Показать цены в:</small>
        <div class="btn-group btn-group-sm" id="currencySwitch">
            <button class="btn btn-outline-secondary active" data-currency="RUB">₽ RUB</button>
            <button class="btn btn-outline-secondary" data-currency="USD">$ USD</button>
            <button class="btn btn-outline-secondary" data-currency="EUR">€ EUR</button>
        </div>
        <small class="text-muted" id="rateInfo"
               th:text="'USD=' + ${rates.usd} + '₽, EUR=' + ${rates.eur} + '₽'"></small>
    </div>

    <!-- Products grid -->
    <div th:if="${products.empty}" class="text-center py-5 text-muted">
        <i class="bi bi-search fs-1"></i>
        <p class="mt-2">Ничего не найдено. <a th:href="@{/catalog}">Сбросить фильтры</a></p>
    </div>

    <div class="row g-4" th:unless="${products.empty}">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products.content}">
            <div class="card product-card h-100 border-0 shadow-sm">
                <a th:href="@{/catalog/{id}(id=${product.id})}" class="text-decoration-none">
                    <div class="product-img-wrap">
                        <img th:src="${product.imageUrl != null ? product.imageUrl : '/img/placeholder.svg'}"
                             class="card-img-top product-img" th:alt="${product.name}">
                        <span th:if="${!product.available}" class="badge bg-secondary position-absolute top-0 end-0 m-2">Нет в наличии</span>
                    </div>
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title fw-semibold text-dark">
                        <a th:href="@{/catalog/{id}(id=${product.id})}"
                           class="text-decoration-none text-dark" th:text="${product.name}">Название</a>
                    </h6>
                    <p class="text-muted small flex-grow-1 mb-2"
                       th:text="${#strings.abbreviate(product.description, 70)}"></p>
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <span class="fw-bold text-pink price-display"
                              th:data-rub="${product.price}"
                              th:text="${product.price} + ' ₽'"></span>
                        <div class="d-flex gap-1">
                            <a th:href="@{/catalog/{id}(id=${product.id})}"
                               class="btn btn-sm btn-outline-secondary" title="Подробнее">
                                <i class="bi bi-eye"></i>
                            </a>
                            <button class="btn btn-sm btn-pink add-to-cart"
                                    th:data-product-id="${product.id}"
                                    th:disabled="${!product.available}"
                                    sec:authorize="isAuthenticated()"
                                    title="В корзину">
                                <i class="bi bi-cart-plus"></i>
                            </button>
                            <a th:href="@{/auth/login}" class="btn btn-sm btn-pink"
                               sec:authorize="!isAuthenticated()" title="Войдите чтобы купить">
                                <i class="bi bi-cart-plus"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${products.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/catalog(page=${products.number - 1},
                    categoryId=${selectedCategoryId}, query=${query}, sort=${sort})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:href="@{/catalog(page=${i},
                    categoryId=${selectedCategoryId}, query=${query}, sort=${sort})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/catalog(page=${products.number + 1},
                    categoryId=${selectedCategoryId}, query=${query}, sort=${sort})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

</div>
</main>
<th:block th:fragment="scripts">
<script th:src="@{/js/cart.js}"></script>
<script>
// Currency switcher via AJAX
$(function(){
    var usdRate = parseFloat('[[${rates != null ? rates.usd : 90}]]');
    var eurRate = parseFloat('[[${rates != null ? rates.eur : 98}]]');
    var currentCurrency = 'RUB';

    $('#currencySwitch button').on('click', function(){
        $('#currencySwitch button').removeClass('active');
        $(this).addClass('active');
        currentCurrency = $(this).data('currency');
        updatePrices();
    });

    function updatePrices(){
        $('.price-display').each(function(){
            var rub = parseFloat($(this).data('rub'));
            var display;
            if(currentCurrency === 'USD'){
                display = '$ ' + (rub / usdRate).toFixed(2);
            } else if(currentCurrency === 'EUR'){
                display = '€ ' + (rub / eurRate).toFixed(2);
            } else {
                display = rub.toFixed(2) + ' ₽';
            }
            $(this).text(display);
        });
    }
});
</script>
</th:block>
</body>
</html>
