<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Профиль — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="page-header mb-0">
    <div class="container">
        <h2 class="mb-0"><i class="bi bi-person-circle me-2"></i>Мой профиль</h2>
    </div>
</div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center p-4">
                <div class="mb-3">
                    <i class="bi bi-person-circle text-pink" style="font-size:5rem"></i>
                </div>
                <h5 class="fw-bold" th:text="${user.username}"></h5>
                <p class="text-muted small" th:text="${user.email}"></p>
                <span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                      th:text="${user.role.name() == 'ADMIN'} ? 'Администратор' : 'Покупатель'"></span>
                <hr>
                <p class="text-muted small mb-0">
                    <i class="bi bi-calendar3"></i>
                    Зарегистрирован: <span th:text="${#temporals.format(user.createdAt,'dd.MM.yyyy')}"></span>
                </p>
            </div>
            <div class="card border-0 shadow-sm mt-3">
                <div class="card-body text-center">
                    <a th:href="@{/orders/history}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-bag"></i> Мои заказы
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold mb-4">Личные данные</h5>
                    <form th:action="@{/profile}" method="post" th:object="${profileDto}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Имя</label>
                                <input type="text" th:field="*{firstName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                       placeholder="Иван">
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Фамилия</label>
                                <input type="text" th:field="*{lastName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                       placeholder="Иванов">
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Телефон</label>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   placeholder="+7 (999) 000-00-00">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                        <button type="submit" class="btn btn-pink fw-semibold px-4">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
