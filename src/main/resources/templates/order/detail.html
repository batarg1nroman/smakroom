<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title th:text="'Заказ #' + ${order.id} + ' — SmakRoom'">Заказ — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="page-header mb-0">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0" style="--bs-breadcrumb-divider-color:rgba(245,200,216,.5); font-size:.9rem">
                <li class="breadcrumb-item"><a th:href="@{/orders/history}" style="color:var(--blush)">Мои заказы</a></li>
                <li class="breadcrumb-item active" style="color:rgba(245,200,216,.7)" th:text="'Заказ #' + ${order.id}"></li>
            </ol>
        </nav>
    </div>
</div>

<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3" style="display:none">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/orders/history}">Мои заказы</a></li>
            <li class="breadcrumb-item active" th:text="'Заказ #' + ${order.id}"></li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold" th:text="'Заказ #' + ${order.id}"></h5>
                    <span class="badge fs-6"
                          th:classappend="${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                         (${order.status.name() == 'CONFIRMED'} ? 'bg-info' :
                                         (${order.status.name() == 'READY'} ? 'bg-success' :
                                         (${order.status.name() == 'COMPLETED'} ? 'bg-secondary' :
                                         (${order.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-primary'))))"
                          th:text="${order.status.displayName}">
                    </span>
                </div>
                <div class="card-body p-0">
                    <div th:each="item : ${order.items}" class="d-flex align-items-center gap-3 p-3 border-bottom">
                        <img th:src="${item.product.imageUrl != null ? item.product.imageUrl : '/img/placeholder.svg'}"
                             class="rounded" style="width:60px;height:60px;object-fit:cover">
                        <div class="flex-grow-1">
                            <p class="fw-semibold mb-0" th:text="${item.product.name}"></p>
                            <small class="text-muted"
                                   th:text="${item.quantity} + ' × ' + ${item.price} + ' ₽'"></small>
                        </div>
                        <span class="fw-bold" th:text="${item.subtotal} + ' ₽'"></span>
                    </div>
                </div>
                <div class="card-footer bg-transparent d-flex justify-content-between fw-bold fs-5">
                    <span>Итого:</span>
                    <span class="text-pink" th:text="${order.totalPrice} + ' ₽'"></span>
                </div>
            </div>

            <div th:if="${order.notes != null and !order.notes.isBlank()}"
                 class="card border-0 shadow-sm mt-3">
                <div class="card-body">
                    <h6 class="fw-bold"><i class="bi bi-chat-left-text"></i> Комментарий</h6>
                    <p class="mb-0 text-muted" th:text="${order.notes}"></p>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Информация о заказе</h6>
                    <p class="mb-1 small"><strong>Дата:</strong>
                        <span th:text="${#temporals.format(order.createdAt,'dd.MM.yyyy HH:mm')}"></span></p>
                    <p class="mb-1 small"><strong>Способ получения:</strong> Самовывоз</p>
                    <p class="mb-0 small"><strong>Адрес:</strong> г. Казань, Проезд Яраткан 3А, подъезд 3</p>
                </div>
            </div>

            <div th:if="${order.status.name() == 'PENDING'}" class="card border-0 shadow-sm border-danger">
                <div class="card-body">
                    <h6 class="fw-bold text-danger mb-2">Отмена заказа</h6>
                    <p class="small text-muted mb-3">Отменить заказ можно только пока он ожидает подтверждения.</p>
                    <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"
                          onsubmit="return confirm('Вы уверены, что хотите отменить заказ?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger w-100 btn-sm">
                            <i class="bi bi-x-circle"></i> Отменить заказ
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
