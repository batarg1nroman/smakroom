<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::head-extra}, ~{::scripts})}">
<head>
    <title>Мои заказы — SmakRoom</title>
    <th:block th:fragment="head-extra"></th:block>
</head>
<body>
<main th:fragment="main">
<div class="page-header mb-0">
    <div class="container">
        <h2 class="mb-0"><i class="bi bi-bag me-2"></i>Мои заказы</h2>
    </div>
</div>

<div class="container py-4">

    <div th:if="${orders.empty}" class="text-center py-5 text-muted">
        <i class="bi bi-bag-x" style="font-size:4rem"></i>
        <p class="mt-3 fs-5">У вас ещё нет заказов</p>
        <a th:href="@{/catalog}" class="btn btn-pink mt-2">В каталог</a>
    </div>

    <div th:unless="${orders.empty}">
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>№</th>
                            <th>Дата</th>
                            <th>Позиций</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders.content}">
                            <td><strong th:text="'#' + ${order.id}"></strong></td>
                            <td th:text="${#temporals.format(order.createdAt,'dd.MM.yyyy HH:mm')}"></td>
                            <td th:text="${#lists.size(order.items)}"></td>
                            <td class="fw-semibold text-pink" th:text="${order.totalPrice} + ' ₽'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                                     (${order.status.name() == 'CONFIRMED'} ? 'bg-info' :
                                                     (${order.status.name() == 'READY'} ? 'bg-success' :
                                                     (${order.status.name() == 'COMPLETED'} ? 'bg-secondary' :
                                                     (${order.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-primary'))))"
                                      th:text="${order.status.displayName}">
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/orders/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-eye"></i> Детали
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${orders.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/orders/history(page=${orders.number - 1})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                    th:classappend="${i == orders.number} ? 'active'">
                    <a class="page-link" th:href="@{/orders/history(page=${i})}" th:text="${i+1}">1</a>
                </li>
                <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/orders/history(page=${orders.number + 1})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
